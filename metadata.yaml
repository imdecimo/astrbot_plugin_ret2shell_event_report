name: astrbot_plugin_ret2shell_event_report
display_name: Ret2Shell 赛事事件播报
desc: |
  对接 Ret 2 Shell (回归终端) 赛事事件推送 WebSocket API，
  实现赛事事件实时播报和信息查询功能。

  功能特性：
  - 实时推送赛事事件（题目上/下线、一/二/三血、里程碑、新通知等）
  - 查询赛事信息 (/game)
  - 查询总榜排行 (/rank)
  - 支持多目标 UMO 推送（公开/管理/运维三级分类）
  - 可选平台账号鉴权，解锁题目查询并启用断线通知补偿
  - WebSocket 指数退避重连

  配置说明：
  - ret2shell_ws_link: Ret2Shell WebSocket 地址（必填）
  - ret2shell_account / ret2shell_password: 平台账号（可选，留空为匿名只读）
  - public_umo: 公开播报目标 UMO 列表
  - admin_umo: 管理播报目标 UMO 列表
  - ops_umo: 运维播报目标 UMO 列表
version: 1.3.0
author: decimo
repo: https://github.com/imdecimo/astrbot_plugin_ret2shell_event_report
astrbot_version: ">=4.17.0"
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - ctf
  - ret2shell
  - 赛事播报
